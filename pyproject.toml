[tool.ruff]
# Target version of the Python runtime
target-version = "py312"
line-length = 120

[tool.ruff.lint]
# E (Error), F (Pyflakes), B (Bugbear), I (Isort)
select = ["E", "F", "B", "I"]
ignore = []

[tool.ruff.lint.isort]
# Global layout configuration for import sorting
known-first-party = ["src"]

[tool.pytest.ini_options]
pythonpath = [".", "src", "src/backend"]
asyncio_mode = "auto"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning"
]
