version: '3.8'

services:
  # Database Service
  neo4j:
    image: neo4j:5.18-community
    container_name: shark_neo4j
    ports:
      - "7474:7474" # Neo4j Browser (GUI)
      - "7687:7687" # Bolt protocol
    environment:
      - NEO4J_AUTH=${NEO4J_USER}/${NEO4J_PASSWORD}
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

  # Web Service (Backend FastAPI + Frontend SPA)
  web:
    build: .
    container_name: shark_web
    ports:
      - "8000:8000"
    volumes:
      - ./src:/app/src
    environment:
      - NEO4J_URI=bolt://${NEO4J_HOST}:${NEO4J_PORT}
      - NEO4J_USER=${NEO4J_USER}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD}
      - PYTHONPATH=/app/src
      - ADMIN_USERNAME=${ADMIN_USERNAME}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
    depends_on:
      neo4j:
        condition: service_healthy

volumes:
  neo4j_data:
  neo4j_logs:
