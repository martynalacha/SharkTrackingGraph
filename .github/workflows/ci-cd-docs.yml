name: Continuous Deployment - Docs

on:
  push:
    branches: [ main ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  NEO4J_URI: bolt://localhost:7687
  NEO4J_USER: neo4j
  NEO4J_PASSWORD: secret_password_ci

jobs:
  deploy-docs:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    services:
      neo4j:
        image: neo4j:latest
        ports:
          - 7687:7687
          - 7474:7474
        env:
          NEO4J_AUTH: neo4j/secret_password_ci
        options: >-
          --health-cmd "cypher-shell -u neo4j -p secret_password_ci 'RETURN 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies and tools
      run: |
        python -m pip install --upgrade pip
        if [ -f src/backend/requirements.txt ]; then pip install -r src/backend/requirements.txt; fi
        pip install --upgrade fastapi uvicorn
        pip install mkdocs mkdocs-material

    - name: Set up database constraints
      env:
        PYTHONPATH: ".:src"
      run: |
        python -c "from src.backend.app.database.constraints import setup_database_constraints; setup_database_constraints()"

    - name: Seed mock database data
      env:
        PYTHONPATH: ".:src"
        NEO4J_URI: "bolt://localhost:7687"
        NEO4J_USER: "neo4j"
        NEO4J_PASSWORD: "secret_password_ci"
      run: |
        python -c "
        import asyncio
        import os
        from neo4j import GraphDatabase

        uri = os.environ['NEO4J_URI']
        user = os.environ['NEO4J_USER']
        password = os.environ['NEO4J_PASSWORD']

        driver = GraphDatabase.driver(uri, auth=(user, password))

        # Używamy synchronicznej sesji, więc nie używamy async with
        def seed():
            session = driver.session()
            try:
                session.run('CREATE (:Shark)-[:MIGRATED_TO]->(:OceanGrid)')
            finally:
                session.close()

        seed()
        driver.close()
        "
    - name: Generate dynamic documentation files
      env:
        PYTHONPATH: ".:src"
      run: |
        python src/backend/app/database/generate_docs.py

    - name: Deploy documentation to GitHub Pages
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        PYTHONPATH: ".:src"
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        mkdocs gh-deploy --force --verbose
