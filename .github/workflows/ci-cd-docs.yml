name: Continuous Deployment - Docs

on:
  push:
    branches: [ main ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  NEO4J_URI: bolt://localhost:7687
  NEO4J_USER: neo4j
  NEO4J_PASSWORD: secret_password_ci

jobs:
  deploy-docs:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    services:
      neo4j:
        image: neo4j:latest
        ports:
          - 7687:7687
          - 7474:7474
        env:
          NEO4J_AUTH: neo4j/secret_password_ci

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies and tools
      run: |
        python -m pip install --upgrade pip
        # Instalacja wszystkich wymaganych pakietów w jednym środowisku
        if [ -f src/backend/requirements.txt ]; then pip install -r src/backend/requirements.txt; fi
        pip install --upgrade fastapi uvicorn
        pip install mkdocs mkdocs-material "mkdocstrings[python]"

    - name: Set up database constraints
      env:
        PYTHONPATH: ".:src"
      run: |
        python -c "from src.backend.app.database.constraints import setup_database_constraints; setup_database_constraints()"

    - name: Seed database data
      env:
        PYTHONPATH: ".:src"
      run: |
        python -c "from src.backend.app.database.seeding import seed_database; seed_database('src/backend/app/database/clean_data.py')"

    - name: Generate dynamic documentation files
      env:
        PYTHONPATH: ".:src"
      run: |
        python src/backend/app/database/generate_docs.py

    - name: Deploy documentation to GitHub Pages
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        PYTHONPATH: ".:src"
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        mkdocs gh-deploy --force --verbose
